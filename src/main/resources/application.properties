# ===== Database (Neon Postgres) =====
# Real values come from environment variables on Render. These fallbacks are local-dev
# placeholders only - never put real credentials here, this repository is public.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/masterpiece_quotes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===== HikariCP - tuned for Neon (suspends when idle) + Render free tier =====
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

# ===== Schema: owned by Flyway, verified by Hibernate =====
# Flyway applies db/migration on startup. On the pre-existing production database (created by
# the old ddl-auto=update) it records V1 as the baseline instead of re-running it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Hibernate never changes the schema; it only refuses to start if entities and tables disagree,
# so a bad deploy fails before taking traffic instead of corrupting data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
# Render terminates TLS in front of the app; trust its forwarded client IP for rate limiting.
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never

# ===== Security =====
# APP_PASSWORD is required (4+ characters; 12+ recommended). The app refuses to start without it.
app.auth.username=owner
app.auth.password=${APP_PASSWORD:}
# Per IP: 5 wrong passwords -> locked for 15 minutes.
app.auth.max-failures=5
app.auth.lockout-minutes=15
# All IPs together: 30 wrong passwords within an hour -> sign-in paused for the rest of that hour.
app.auth.global-max-failures=30
app.auth.global-window-minutes=60

# ===== CORS =====
# Comma-separated list of allowed frontend origins, e.g. https://masterpiece-quotes.vercel.app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Business calendar: "this month", default quote dates and validity are computed in IST.
app.timezone=Asia/Kolkata

logging.level.com.masterpiece=INFO
