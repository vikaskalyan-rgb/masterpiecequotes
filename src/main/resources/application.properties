# ===== Database (Neon Postgres) =====
# Real values come from environment variables on Render. These fallbacks are safe local-dev
# placeholders only - NEVER put real credentials here, this file is committed to git.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/masterpiece_quotes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== HikariCP - tuned for Neon + Render free tier =====
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.initializationFailTimeout=0

spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
server.port=${PORT:8080}

# ===== JPA =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===== CORS =====
# Comma-separated list of allowed frontend origins. Set CORS_ORIGINS on Render to your real
# Vercel URL(s) once deployed, e.g. https://masterpiece-quotes.vercel.app
app.cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
